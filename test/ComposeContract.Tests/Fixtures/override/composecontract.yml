version: 1
project:
  compose: compose.yml
  override: compose.override.yml
env:
  example: .env.example
  local: .env
profiles:
  default: []
rules:
  services:
    required: [api, db]
  env:
    required: [ASPNETCORE_ENVIRONMENT, ConnectionStrings__Default]
    optional: []
  options:
    assemblies: []
    types: []
severity:
  missing_service: error
  missing_env_required: error
  missing_env_optional: warn
  unknown_env_in_example: warn
