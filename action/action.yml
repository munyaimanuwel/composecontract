name: StackContract Validate
description: Run stackcontract validate (local-first; no Docker daemon)
inputs:
  contract:
    description: Path to stackcontract.yml
    required: false
    default: stackcontract.yml
  strict:
    description: Promote warnings to errors
    required: false
    default: 'true'
  working-directory:
    description: Working directory
    required: false
    default: '.'
runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Install stackcontract tool
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if [ -d nupkg ]; then
          dotnet tool install --add-source ./nupkg -g stackcontract
        else
          dotnet tool install -g stackcontract
        fi

        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
    - name: Validate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        ARGS=(validate --contract "${{ inputs.contract }}")
        if [ "${{ inputs.strict }}" = "true" ]; then ARGS+=(--strict); fi
        stackcontract "${ARGS[@]}"
