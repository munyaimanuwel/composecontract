# Publishes nupkgs to nuget.org via Trusted Publishing (OIDC).
# No long-lived API key. nuget.org policy must match this file name: publish.yml
# Docs: https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
name: Publish NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to pack and publish
        required: true
        default: v0.1.1
      mode:
        description: publish public packages, or unlist internal 0.1.0 IDs
        required: true
        default: publish
        type: choice
        options:
          - publish
          - unlist-internal

concurrency:
  group: nuget-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pack:
    if: github.event_name == 'release' || inputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test StackContract.sln -c Release --nologo
      - name: Pack public packages only
        run: |
          set -euo pipefail
          dotnet pack src/StackContract.Cli/StackContract.Cli.csproj -c Release -o ./nupkg --nologo
          dotnet pack src/StackContract.AspNetCore/StackContract.AspNetCore.csproj -c Release -o ./nupkg --nologo
          mapfile -t pkgs < <(find nupkg -name '*.nupkg' | sort)
          printf '%s\n' "${pkgs[@]}"
          if [ "${#pkgs[@]}" -ne 2 ]; then
            echo "expected 2 nupkgs (stackcontract + StackContract.AspNetCore), got ${#pkgs[@]}"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' || inputs.mode == 'publish'
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg
          path: nupkg
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        run: >
          dotnet nuget push "nupkg/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  unlist-internal:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'unlist-internal'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Unlist internal 0.1.0 packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for id in StackContract.Core StackContract.Engine StackContract.Compose StackContract.Env StackContract.Options; do
            echo "Unlisting $id 0.1.0"
            dotnet nuget delete "$id" 0.1.0 \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --non-interactive
          done
