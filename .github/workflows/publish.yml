# Publishes nupkgs to nuget.org via Trusted Publishing (OIDC).
# No long-lived API key. nuget.org policy must match this file name: publish.yml
# Docs: https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
name: Publish NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to pack and publish
        required: true
        default: v0.1.0

concurrency:
  group: nuget-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test StackContract.sln -c Release --nologo
      - run: dotnet pack StackContract.sln -c Release -o ./nupkg --nologo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg
          path: nupkg
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        run: >
          dotnet nuget push "nupkg/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
